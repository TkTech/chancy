name: Test and Release

on:
  release:
    types:
      - published
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.1.6

    - name: Set up Python
      uses: actions/setup-python@v6.0.0
      with:
        python-version: "3.13"

    - name: Install uv
      run: pip install uv

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: "npm"
        cache-dependency-path: chancy/plugins/api/ui/package-lock.json

    - name: Installing dependencies (Node)
      working-directory: chancy/plugins/api/ui
      run: npm ci

    - name: Building UI
      working-directory: chancy/plugins/api/ui
      run: npm run build

    - name: Checking for code smells
      run: uvx --from ruff==0.16.2 ruff check

    - name: Checking for formatting issues
      run: uvx --from ruff==0.16.2 ruff format --check

    - name: Build package
      run: uv build

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel-package
        path: dist/*.whl
        retention-days: 1

    - name: Upload source artifact
      uses: actions/upload-artifact@v4
      with:
        name: source-package
        path: dist/*.tar.gz
        retention-days: 1

  test:
    name: "${{ matrix.os }} - Py${{ matrix.python-version }} - Django${{ matrix.django }} - PG${{ matrix.pg }}"
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        os: ["ubuntu-24.04", "macos-14", "windows-2022"]
        # Django 5.2 supports both Python endpoints and PostgreSQL 14+.
        django: ["5.2"]
        pg: ["14", "18"]
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: postgres
          password: localtest
          database: postgres
          port: 8190
          postgres-version: ${{ matrix.pg }}
        id: postgres

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installing uv
        run: pip install uv

      - name: Installing dependencies (Python)
        run: |
          uv sync --all-extras
          uv pip install --upgrade "django==${{ matrix.django }}.*"
          uv run --no-sync python -m django --version

      # Keep the selected Django version instead of restoring the lockfile's.
      - name: Running tests (parallel)
        run: |
          uv run --no-sync pytest -n auto -v --cov=chancy --cov-report=xml

      - name: Running Django ORM tests (sequential)
        run: |
          uv run --no-sync pytest tests/contrib/django/test_models.py -v --cov=chancy --cov-report=xml --cov-append

      - name: Uploading coverage
        uses: codecov/codecov-action@v4
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          slug: TkTech/chancy

  test-django:
    name: "Django${{ matrix.compatibility.django }} - Py${{ matrix.python-version }} - PG${{ matrix.compatibility.pg }}"
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        # Test the oldest supported PostgreSQL and the newest for each Django.
        # Django 6.0 supports PostgreSQL 14+; Django 6.1 requires 15+.
        compatibility:
          - {django: "6.0", pg: "14"}
          - {django: "6.0", pg: "18"}
          - {django: "6.1", pg: "15"}
          - {django: "6.1", pg: "18"}

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: postgres
          password: localtest
          database: postgres
          port: 8190
          postgres-version: ${{ matrix.compatibility.pg }}
        id: postgres

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installing uv
        run: pip install uv

      - name: Installing dependencies (Python)
        run: |
          uv sync --all-extras
          uv pip install --upgrade "django==${{ matrix.compatibility.django }}.*"
          uv run --no-sync python -m django --version

      - name: Running Django integration tests
        run: |
          uv run --no-sync pytest tests/contrib/django/ -s -v

  docs:
    name: Building Documentation
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.6

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"

      - name: Installing dependencies
        run: sudo apt-get install graphviz

      - name: Installing uv
        run: pip install uv

      - name: Installing dependencies (Python)
        run: uv sync --all-extras

      - name: Building docs
        run: |
          cd docs && uv run make clean html

      - name: Publishing documentation
        if: github.event_name == 'release'
        run: |
          uv run ghp-import -f -n -p docs/_build/html

  release:
    name: Release to PyPI
    needs: [build, docs]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Publishing to PyPI
        run: |
          uv publish
