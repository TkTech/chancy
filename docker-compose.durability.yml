name: chancy-durability

services:
  db:
    image: postgres:${POSTGRES_VERSION:-18}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localtest
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:18190:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    ports:
      - "127.0.0.1:18474:8474"
      - "127.0.0.1:18191:18191"
      - "127.0.0.1:18192:18192"
